<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151a25"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Rutina verano"><title>Rutina verano</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#f5f7fa;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:600px;margin:auto;padding:24px 16px 70px}h1{font-size:29px;margin:8px 0}p{color:#aab5c5}nav{display:flex;gap:8px;margin:22px 0}button{border:0;border-radius:12px;padding:12px;color:white;background:#344256;font-weight:700}nav button{flex:1}.active{background:#bd7a9c}.card{background:#202b3b;border:1px solid #39475a;border-radius:16px;padding:15px;margin:12px 0}.card h3{margin:0 0 7px}.sub{font-size:13px;color:#aab5c5}.check{float:right;transform:scale(1.5);accent-color:#bd7a9c}.card input[type=number]{width:76px;padding:9px;background:#121c2a;border:1px solid #536278;border-radius:9px;color:white;font-size:16px}footer{position:sticky;bottom:0;background:#111827;padding:12px 0}.timer{display:flex;gap:8px;align-items:center}.timer button{flex:1}#clock{font-size:25px;font-variant-numeric:tabular-nums;min-width:75px;text-align:center}</style></head><body><main><small>MI ENTRENAMIENTO · VERANO</small><h1>Rutina de 60 minutos 💪</h1><p>Elegí el día, marcá ejercicios y registrá los kilos. Los datos se guardan en este dispositivo.</p><nav id="tabs"></nav><section id="items"></section><p id="progress"></p><footer><div class="timer"><span id="clock">01:00</span><button onclick="start(60)">Descanso 60 s</button><button onclick="start(90)">90 s</button><button onclick="stop()">Parar</button></div></footer></main><script>
const days={
"Lunes":[["Hip thrust con barra","3 × 10–12","Puente de glúteos con mancuerna"],["Step-up bajo","3 × 8 por pierna","Prensa unilateral"],["Peso muerto rumano","3 × 10","Mancuernas o barra"],["Sentadilla lateral","2 × 10 por lado","Desplante lateral asistido"],["Hiperextensiones a 45°","2 × 12–15","Sin peso, priorizando control"],["Abducción de cadera","2 × 15","Acostada con minibanda"]],
"Miércoles":[["Dominadas asistidas","3 × 6–8","Jalón al pecho"],["Press plano con mancuernas","3 × 8–10","Press en colchoneta"],["Remo en polea baja","3 × 10–12","Remo con mancuerna apoyada"],["Press militar sentado","2 × 10","Press con mancuernas livianas"],["Jalón agarre neutro","2 × 10–12","Jalón con banda anclada"],["Mariposa inversa","3 × 12–15","Aperturas inversas con mancuernas"],["Elevaciones laterales","2 × 12–15","Elevaciones con banda"]],
"Viernes":[["Sentadilla búlgara","3 × 8–10 por pierna","Zancada hacia atrás con apoyo"],["Peso muerto sumo","3 × 8–10","Peso muerto con mancuernas, postura cómoda"],["Pullover en polea","3 × 12–15","Pullover con mancuerna"],["Press inclinado con mancuernas","3 × 10","Flexiones inclinadas"],["Remo unilateral","3 × 10 por brazo","Remo unilateral en polea"],["Face pull","3 × 15","Aperturas inversas con banda"],["Curl martillo + press francés","2 × 12 cada uno","Mancuernas o bandas"]]};
let day=localStorage.getItem("rutina-dia")||"Lunes",interval=null;const key=(i,t)=>"verano-"+day+"-"+i+"-"+t;function render(){document.getElementById("tabs").innerHTML=Object.keys(days).map(d=>'<button class="'+(d===day?'active':'')+'" onclick="change(\''+d+'\')">'+d+'</button>').join("");document.getElementById("items").innerHTML=days[day].map((x,i)=>'<article class="card"><input class="check" type="checkbox" '+(localStorage.getItem(key(i,"done"))==="1"?"checked":"")+' onchange="save('+i+',\'done\',this.checked?\'1\':\'0\')"><h3>'+(i+1)+'. '+x[0]+'</h3><div>'+x[1]+'</div><p class="sub">Alternativa: '+x[2]+'</p><label class="sub">Carga (kg) <input type="number" inputmode="decimal" step="0.5" value="'+(localStorage.getItem(key(i,"kg"))||"")+'" onchange="save('+i+',\'kg\',this.value)"></label></article>').join("");progress()}function change(d){day=d;localStorage.setItem("rutina-dia",d);render()}function save(i,t,v){localStorage.setItem(key(i,t),v);progress()}function progress(){let n=days[day].filter((_,i)=>localStorage.getItem(key(i,"done"))==="1").length;document.getElementById("progress").textContent=n+" de "+days[day].length+" ejercicios completados"}function stop(){clearInterval(interval);interval=null}function start(s){stop();let end=Date.now()+s*1000;function tick(){let left=Math.max(0,Math.ceil((end-Date.now())/1000));document.getElementById("clock").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");if(!left){stop();if(navigator.vibrate)navigator.vibrate(200)}}tick();interval=setInterval(tick,250)}render();
</script></body></html>
